# Build the mlab-node Debian package.
#
# Every push/PR builds the amd64 .deb inside a debian:bookworm container (the
# oldest supported target: its glibc sets the package's libc6 floor, so the
# .deb installs on bookworm and anything newer) and uploads it as a CI
# artifact. Pushing a v* tag additionally creates a GitHub Release with the
# .deb attached, versioned from the tag.
#
# Publishing follows M-Lab's project tiers: pushes to main upload the ~dev
# snapshot to the mlab-staging Artifact Registry APT repository, which the
# staging autonode-deb VM tracks; manual dispatches upload it to mlab-sandbox
# instead; v* tags upload the release to mlab-autojoin. Branches under test
# reach the sandbox VM through Cloud Build (.build/cloudbuild.yaml), not APT.
# Authentication goes through m-lab's shared GitHub Workload Identity pool,
# bound directly to this repository on each APT repository (no service account
# keys). Forked PRs never reach these jobs: they have no id-token permission.
#
# The component binaries are downloaded from the pinned, checksum-verified
# releases in .build/components.env; only scamper is compiled here, so the
# build needs no Go toolchain and no cache.
name: build-deb

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Never cancel main or tag runs: their publish jobs have side effects.
concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    # Container jobs default to sh; the version-stamping step uses bashisms.
    defaults:
      run:
        shell: bash
    env:
      DEBEMAIL: support@measurementlab.net
      DEBFULLNAME: Measurement Lab
    steps:
      # debhelper comes from bookworm-backports: bookworm's 13.11.4 does not
      # look for units in usr/lib/systemd/system (see debian/rules).
      - name: Install build dependencies
        run: |
          echo "deb http://deb.debian.org/debian bookworm-backports main" \
            > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts lintian file ca-certificates curl
          apt-get install -y --no-install-recommends -t bookworm-backports debhelper

      - uses: actions/checkout@v7

      # Tag builds get the tag as their version; anything else gets a
      # ~dev.<run>.g<sha> suffix, which sorts before the plain version so
      # snapshots upgrade cleanly to the eventual release.
      - name: Set package version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            dch -b --newversion "${GITHUB_REF_NAME#v}" \
              --distribution unstable "Release ${GITHUB_REF_NAME}."
          else
            base="$(dpkg-parsechangelog -SVersion)"
            dch -b --newversion "${base}~dev.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA::7}" \
              --distribution UNRELEASED "CI snapshot build."
          fi
          dpkg-parsechangelog -SVersion

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian --fail-on error --tag-display-limit 0 ../mlab-node_*.changes

      # The postinst guards every systemd interaction on /run/systemd/system,
      # so installing in the build container exercises the maintainer scripts
      # (debconf, sysusers, tmpfiles, enable) without an init system.
      # Installing on bookworm itself proves the computed libc6 floor is
      # satisfiable on the oldest supported target. Preseeding two answers
      # checks the debconf -> /etc/mlab-node path; the rest take the defaults
      # (unattended upgrades on) or the config script's guesses. The max rate
      # is asked in Mbit/s but stored in bit/s: the install checks the guess
      # (7000 for a 10g uplink) lands converted, and a noninteractive
      # reconfigure checks the round trip leaves the file unchanged.
      - name: Install smoke test
        run: |
          echo "mlab-node mlab-node/iata string oma" | debconf-set-selections
          echo "mlab-node mlab-node/uplink string 10g" | debconf-set-selections
          DEBIAN_FRONTEND=noninteractive apt-get install -y ../mlab-node_*.deb
          dpkg -V mlab-node
          echo "Depends: $(dpkg-deb -f ../mlab-node_*.deb Depends)"
          grep -qx 'IATA=oma' /etc/mlab-node/node.env
          grep -qx 'UPLINK=10g' /etc/mlab-node/node.env
          grep -qx 'INTERFACE_MAXRATE=7000000000' /etc/mlab-node/node.env
          DEBIAN_FRONTEND=noninteractive dpkg-reconfigure mlab-node
          debconf-show mlab-node | grep -q 'mlab-node/interface-maxrate: 7000$'
          grep -qx 'INTERFACE_MAXRATE=7000000000' /etc/mlab-node/node.env
          test "$(stat -c %a /etc/mlab-node/api-key.env)" = 600
          apt-config dump | grep -q 'Unattended-Upgrade::Origins-Pattern:: "origin=mlab-node,label=mlab-node";'
          sed -n '/^[A-Z]/p' /etc/mlab-node/node.env

      - name: Collect artifacts
        run: mkdir -p dist && mv ../mlab-node_* dist/

      # Artifacts only hand files between jobs of the same run; 1 day keeps
      # "re-run failed jobs" working.
      - uses: actions/upload-artifact@v7
        with:
          name: mlab-node-deb-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    # Same guard as publish-stable: only v* tag pushes create a release.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mlab-node-deb-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.deb \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  publish-snapshot:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Main tracks staging. A manual dispatch always targets sandbox, so any
    # branch can be pushed to the dev repository without touching staging.
    env:
      PROJECT: ${{ github.event_name == 'workflow_dispatch' && 'mlab-sandbox' || 'mlab-staging' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: mlab-node-deb-*
          merge-multiple: true
          path: dist

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: projects/808951263862/locations/global/workloadIdentityPools/github/providers/m-lab-repos

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload to the ${{ env.PROJECT }} APT repository
        run: .build/apt-publish.sh "${PROJECT}" dist/*.deb

  publish-stable:
    # Push events on tags are already filtered to v* above; requiring a push
    # keeps a workflow_dispatch on an arbitrary tag from publishing a release.
    # Releases go to production (mlab-autojoin) only: staging follows main.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: mlab-node-deb-*
          merge-multiple: true
          path: dist

      - uses: google-github-actions/auth@v2
        with:
          project_id: mlab-autojoin
          workload_identity_provider: projects/808951263862/locations/global/workloadIdentityPools/github/providers/m-lab-repos

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload to the mlab-autojoin APT repository
        run: .build/apt-publish.sh mlab-autojoin dist/*.deb
