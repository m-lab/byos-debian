# Builds the mlab-node .deb and deploys it to the autonode-deb test VM.
#
# Trigger substitutions:
#   _API_KEY      Autojoin API key the node registers with.
#   _PROBABILITY  Probability (0-1) that the node is selected by Locate.
steps:
# Build the package, mirroring .github/workflows/build-deb.yml. Building on
# bookworm keeps the package's libc6 floor at 2.36, which installs on the
# VM's Ubuntu 24.04.
- name: debian:bookworm
  id: build-deb
  entrypoint: bash
  env:
  - 'BUILD_ID=$BUILD_ID'
  - 'DEBEMAIL=support@measurementlab.net'
  - 'DEBFULLNAME=Measurement Lab'
  args:
  - -c
  - |
    set -euxo pipefail
    # debhelper from bookworm-backports: see debian/rules.
    echo "deb http://deb.debian.org/debian bookworm-backports main" \
      > /etc/apt/sources.list.d/backports.list
    apt-get update
    apt-get install -y --no-install-recommends \
      build-essential devscripts file ca-certificates curl
    apt-get install -y --no-install-recommends -t bookworm-backports debhelper
    # Stamp a unique version so every deploy is a real package transition.
    # "~wip" sorts above the CI's "~dev" snapshots (dpkg compares the letters)
    # but below the plain release version, so the VM's periodic upgrade from
    # the dev APT channel does not clobber a branch under test, and a real
    # release still supersedes it.
    dch -b --newversion "$(dpkg-parsechangelog -SVersion)~wip.$${BUILD_ID:0:8}" \
      --distribution UNRELEASED "Cloud Build snapshot."
    dpkg-buildpackage -us -uc -b
    # dpkg-buildpackage writes to the parent of the source tree, which is not
    # persisted between steps; move the .deb into the shared workspace.
    mkdir -p dist && mv ../mlab-node_*.deb dist/

# Deploy to the autonode-deb VM. NOTE: the IATA depends on the region where
# the VM is deployed; our testing VM is always in us-central1, which is OMA.
- name: us-central1-docker.pkg.dev/$PROJECT_ID/build-images/gcloud-jsonnet-cbif:1.1
  id: deploy
  dir: '/workspace/'
  args: [
    '/workspace/.build/deploy.sh $PROJECT_ID ${_API_KEY} ${_PROBABILITY}'
  ]

timeout: 3600s
